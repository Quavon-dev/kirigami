name: Feature request
description: An idea for Kirigami
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or slow today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Kirigami do? Changes that alter vanilla behaviour need to be optional.
    validations:
      required: true
