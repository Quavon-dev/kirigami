name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mc: ${{ steps.version.outputs.mc }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          mc="$(grep '^mcVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          build=""
          latest=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^${mc//./\\.}-([0-9]+)$ ]]; then
              echo "Tag $GITHUB_REF_NAME must be v$mc-<build>, matching mcVersion in gradle.properties" >&2
              exit 1
            fi
            build="${BASH_REMATCH[1]}"
            channel=stable
            if git branch -r --contains "$GITHUB_SHA" | grep -qx '  origin/main'; then
              latest=true
            fi
          else
            version="$mc-edge"
            channel=edge
          fi
          {
            echo "mc=$mc"
            echo "build=$build"
            echo "version=$version"
            echo "channel=$channel"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure Git user
        run: git config --global user.email "actions@github.com" && git config --global user.name "GitHub Actions"
      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build server jar
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          [ -n "$BUILD_NUMBER" ] || unset BUILD_NUMBER
          BUILD_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./gradlew :kirigami-server:createPaperclipJar --stacktrace
      - name: Collect jar and checksum
        run: |
          mkdir dist
          cp kirigami-server/build/libs/kirigami-paperclip-*.jar dist/kirigami.jar
          (cd dist && sha256sum kirigami.jar > kirigami.jar.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: kirigami-${{ steps.version.outputs.version }}
          path: dist/

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kirigami-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish stable release
        if: needs.build.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/kirigami.jar dist/kirigami.jar.sha256 \
            --title "Kirigami ${{ needs.build.outputs.version }}" \
            --generate-notes \
            --latest=${{ needs.build.outputs.latest }}
      - name: Publish edge pre-release
        if: needs.build.outputs.channel == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f edge "$GITHUB_SHA"
          git push -f origin edge
          notes="Build of every commit on main. Current commit: $GITHUB_SHA. Not a stable release."
          if gh release view edge > /dev/null 2>&1; then
            gh release edit edge --title "Kirigami edge (${{ needs.build.outputs.mc }})" --notes "$notes" --prerelease --latest=false
            gh release upload edge dist/kirigami.jar dist/kirigami.jar.sha256 --clobber
          else
            gh release create edge dist/kirigami.jar dist/kirigami.jar.sha256 \
              --title "Kirigami edge (${{ needs.build.outputs.mc }})" --notes "$notes" --prerelease --latest=false
          fi

  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kirigami-${{ needs.build.outputs.version }}
          path: dist
      - name: Prepare build context
        run: cp dist/kirigami.jar docker/kirigami.jar
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ needs.build.outputs.channel == 'edge' }}
            type=raw,value=${{ needs.build.outputs.version }},enable=${{ needs.build.outputs.channel == 'stable' }}
            type=raw,value=${{ needs.build.outputs.mc }},enable=${{ needs.build.outputs.channel == 'stable' }}
            type=raw,value=latest,enable=${{ needs.build.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Kirigami
            org.opencontainers.image.description=Multithreaded Paper fork with vanilla behaviour
            org.opencontainers.image.licenses=GPL-3.0-only
      - uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
