<circle cx="117.5" cy="146.3" r="5" style="fill:var(--serial)"/>
<circle cx="204.4" cy="145.2" r="7" style="fill:var(--ring)"/>
<circle cx="204.4" cy="145.2" r="5" style="fill:var(--serial)"/>
