<circle cx="204.4" cy="277" r="5" style="fill:var(--kiri)"/>
<circle cx="378.2" cy="298.6" r="7" style="fill:var(--ring)"/>
<circle cx="378.2" cy="298.6" r="5" style="fill:var(--kiri)"/>
<circle cx="552" cy="301.1" r="7" style="fill:var(--ring)"/>
<circle cx="552" cy="301.1" r="5" style="fill:var(--kiri)"/>
<text class="end" x="564" y="155">Serial</text>
<text class="end" x="564" y="305.1">Kirigami</text>
<text class="v" x="117.5" y="217.6" text-anchor="middle">59.8</text>
<text class="v" x="204.4" y="264" text-anchor="middle">43.2</text>
<text class="v" x="378.2" y="285.6" text-anchor="middle">35.5</text>
<text class="v" x="552" y="288.1" text-anchor="middle">34.6</text>
<text class="v" x="117.5" y="133.3" text-anchor="middle">89.9</text>
<rect x="656" y="112" width="184" height="292" rx="12" style="fill:var(--plane)"/>
<text class="big" x="680" y="160">2.6×</text>
<text class="bigl" x="680" y="182">faster ticks on 12 cores</text>
<text class="big" x="680" y="254">20 TPS</text>
<text class="bigl" x="680" y="276">from 4 cores up;</text>
<text class="bigl" x="680" y="293">serial manages 11</text>
<text class="big" x="680" y="348">99 %</text>
<text class="bigl" x="680" y="370">of ticks within 50 ms on</text>
<text class="bigl" x="680" y="387">8 and 12 cores; serial 0 %</text>
<text class="a" x="28" y="460">Docker CPU limits on an M2 Max, Paper 26.3 with vanilla settings; serial is the same server with parallelism off. 8 cores ran with one</text>
<text class="a" x="28" y="476">worker fewer than today&#x27;s default. Dashed: fit of 28.5 ms on one thread plus 61.5 ms spread over the cores (within 1 ms of every point).</text>
