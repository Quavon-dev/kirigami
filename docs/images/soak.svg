<path d="M80.2 234.5L100.6 234.2L121 235.4L141.5 228.8L161.9 219.3L182.3 216.1L202.7 221.3L223.1 226.2L243.5 230.9L264 229.5L284.4 233.8L304.8 241L325.2 242.9L345.6 239.4L366 240.6L386.5 237.8L406.9 236.6L427.3 239.8L447.7 243.3L468.1 240.1L488.5 236.1L509 238.9L529.4 238.7L549.8 240.2" style="fill:none;stroke:var(--kiri)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="70" y1="158.5" x2="560" y2="158.5" style="stroke:var(--serial)" stroke-width="2.5"/>
<text class="l" x="76" y="150.5">Serial under the same load (30-minute run): 124 ms median</text>
<text class="l" x="327.2" y="265.7">Kirigami: 77–92 ms median</text>
<line x1="70" y1="290.7" x2="560" y2="290.7" style="stroke:var(--ink2)" stroke-width="1.5"/>
<text class="a" x="560" y="306.7" text-anchor="end">50 ms = 20 TPS</text>
<rect x="594" y="104" width="246" height="284" rx="12" style="fill:var(--plane)"/>
<text class="big" x="616" y="142">0</text>
<text class="bigl" x="616" y="162">errors, crashes or watchdog warnings</text>
<text class="big" x="616" y="210">176,379</text>
<text class="bigl" x="616" y="230">ticks in 4.0 hours</text>
<text class="big" x="616" y="278">5.3 → 5.1 GB</text>
<text class="bigl" x="616" y="298">heap per hour, no growth</text>
<text class="big" x="616" y="346">0</text>
<text class="bigl" x="616" y="366">plugin event overlaps (mtprobe)</text>
<text class="a" x="28" y="420">M2 Max, 12 cores, G1 with a 10 GB heap. 48 players across overworld, Nether and End, LuckPerms, EssentialsX, WorldEdit, WorldGuard,</text>
<text class="a" x="28" y="437">CoreProtect and ViaVersion, 1600 villagers and hopper lines: heavier than 20 TPS allows on purpose. Kirigami 12.2 TPS, serial 8.0.</text>
