<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 676" width="860" height="676" role="img" aria-labelledby="t d">
<style>
svg { --surface:#fcfcfb; --plane:#f4f3ef; --ink:#0b0b0b; --ink2:#52514e; --muted:#77756f; --grid:#e1e0d9; --axis:#c3c2b7;
