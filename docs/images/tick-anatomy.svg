<text class="h" x="28" y="418">World pause</text>
<text class="li" x="28" y="440">A plugin event with listeners or a blocking chunk load comes up:</text>
<text class="li" x="28" y="457">every other thread finishes its current item and waits, and the code</text>
<text class="li" x="28" y="474">runs alone as on Paper. About 5 % of worker time with six plugins.</text>
