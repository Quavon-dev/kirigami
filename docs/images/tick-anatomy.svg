        --serial:#6f6e68; --good:#0ca30c; --idle:#2a2a28; --ring:#1a1a19; }
}
text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.t { font-size:22px; font-weight:650; }
.s { font-size:13.5px; fill:var(--ink2); }
.h { font-size:15px; font-weight:650; }
.l { font-size:13px; }
.a { font-size:12px; fill:var(--muted); }
.n { font-size:12px; fill:var(--ink2); font-variant-numeric:tabular-nums; }
.v { font-size:13px; font-weight:650; }
.big { font-size:40px; font-weight:700; }
.cap { font-size:11px; font-weight:650; letter-spacing:.06em; fill:var(--muted); }
.w { fill:#ffffff; font-weight:700; }

.ph { font-size:13px; font-weight:650; }
.num { font-size:11px; font-weight:700; fill:var(--surface); }
.li { font-size:12.5px; fill:var(--ink2); }
.lib { font-size:12.5px; font-weight:650; }
.seg { font-size:12.5px; font-weight:650; }
.segw { font-size:12.5px; font-weight:650; fill:#ffffff; }
</style>
<title id="t">Inside one tick</title>
<desc id="d">One world tick in vanilla order. Setup, spawn commit, serial entities and cleanup run on the main thread. Spawn search and the entity tracker run on all threads. Random block ticks, entities and block entities run in four steps, A to D cells, on all threads. Plugin code and blocking chunk loads pause the other threads. Of a 90 ms serial tick, about 28.5 ms still runs on one thread and about 61.5 ms runs in parallel, so 12 cores bring it to 34.6 ms.</desc>
