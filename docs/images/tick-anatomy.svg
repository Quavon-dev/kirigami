<text class="li" x="146" y="334">crops, leaves, fluids; 100 % parallel</text>
<text class="lib" x="28" y="356">4</text>
<text class="lib" x="44" y="356">Tracker</text>
<text class="li" x="146" y="356">send entity updates to players, sliced</text>
<text class="lib" x="458" y="290">5</text>
<text class="lib" x="474" y="290">Entities</text>
<text class="li" x="576" y="290">96–99 % parallel; players, vehicles last</text>
<text class="lib" x="458" y="312">6</text>
<text class="lib" x="474" y="312">Block entities</text>
<text class="li" x="576" y="312">99 % parallel; border hopper chains last</text>
<text class="lib" x="458" y="334">7</text>
<text class="lib" x="474" y="334">Cleanup</text>
<text class="li" x="576" y="334">entity management on the main thread</text>
