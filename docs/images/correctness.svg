<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" role="img" aria-labelledby="t d">
<style>
svg { --surface:#fcfcfb; --plane:#f4f3ef; --ink:#0b0b0b; --ink2:#52514e; --muted:#77756f; --grid:#e1e0d9; --axis:#c3c2b7;
      --a:#2a78d6; --b:#eb6834; --c:#1baf7a; --d:#eda100; --kiri:#eb6834; --kiri-wash:rgba(235,104,52,.12);
      --serial:#9b9993; --good:#0ca30c; --idle:#ecebe6; --ring:#fcfcfb; }
@media (prefers-color-scheme: dark) {
  svg { --surface:#1a1a19; --plane:#232321; --ink:#f0efec; --ink2:#c3c2b7; --muted:#9a988f; --grid:#2c2c2a; --axis:#383835;
        --a:#3987e5; --b:#d95926; --c:#199e70; --d:#c98500; --kiri:#d95926; --kiri-wash:rgba(217,89,38,.16);
        --serial:#6f6e68; --good:#0ca30c; --idle:#2a2a28; --ring:#1a1a19; }
}
text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); }
.t { font-size:22px; font-weight:650; }
.s { font-size:13.5px; fill:var(--ink2); }
.h { font-size:15px; font-weight:650; }
.l { font-size:13px; }
.a { font-size:12px; fill:var(--muted); }
.n { font-size:12px; fill:var(--ink2); font-variant-numeric:tabular-nums; }
.v { font-size:13px; font-weight:650; }
.big { font-size:40px; font-weight:700; }
.cap { font-size:11px; font-weight:650; letter-spacing:.06em; fill:var(--muted); }
.w { fill:#ffffff; font-weight:700; }

.ttl { font-size:13.5px; font-weight:650; }
.det { font-size:12.5px; fill:var(--ink2); }
.big { font-size:30px; font-weight:700; }
.bigl { font-size:12.5px; fill:var(--ink2); }
</style>
<title id="t">Correctness: same game, just faster</title>
<desc id="d">Five deterministic contraptions across cell borders give the same readings as vanilla in all 23 runs since the hopper fix. Farm rates over 120,000 ticks differ from vanilla (Fabric with Carpet) by -1.2 to +2.8 percent, every 95 percent interval includes zero. 0 mismatches in 103 million checked parallel spawn searches; 0 overlapping or off-thread plugin events in 33 runs.</desc>
<rect width="860" height="600" rx="14" style="fill:var(--surface)"/>
<text class="t" x="28" y="42">Same game, just faster</text>
<text class="s" x="28" y="65">Kirigami compared with vanilla Minecraft, tick for tick and farm by farm</text>
<text class="cap" x="28" y="112">BIT FOR BIT</text>
<circle cx="38" cy="144" r="9" style="fill:var(--good)"/>
<path d="M-4 0L-1 3L4.5 -3.5" transform="translate(38 144)" style="fill:none;stroke:#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ttl" x="58" y="142">Observer clock</text>
<text class="det" x="58" y="160">vanilla 333 pulses, Kirigami the same</text>
<circle cx="38" cy="190" r="9" style="fill:var(--good)"/>
<path d="M-4 0L-1 3L4.5 -3.5" transform="translate(38 190)" style="fill:none;stroke:#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ttl" x="58" y="188">39-hopper chains across a cell edge</text>
<text class="det" x="58" y="206">vanilla 716 moved, 978 left, Kirigami the same</text>
<circle cx="38" cy="236" r="9" style="fill:var(--good)"/>
<path d="M-4 0L-1 3L4.5 -3.5" transform="translate(38 236)" style="fill:none;stroke:#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ttl" x="58" y="234">Two hoppers racing into one chest</text>
<text class="det" x="58" y="252">vanilla cobble 64, dirt 0, Kirigami the same</text>
<circle cx="38" cy="282" r="9" style="fill:var(--good)"/>
<path d="M-4 0L-1 3L4.5 -3.5" transform="translate(38 282)" style="fill:none;stroke:#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ttl" x="58" y="280">Item sorters across a cell edge</text>
<text class="det" x="58" y="298">vanilla 210 / 35 / 18 sorted, Kirigami the same</text>
<circle cx="38" cy="328" r="9" style="fill:var(--good)"/>
<path d="M-4 0L-1 3L4.5 -3.5" transform="translate(38 328)" style="fill:none;stroke:#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ttl" x="58" y="326">Item pickup on a cell border</text>
<text class="det" x="58" y="344">vanilla 749 per side, Kirigami the same</text>
<text class="det" x="28" y="384">23 of 23 runs since the fix match vanilla exactly.</text>
<text class="det" x="28" y="402">The hopper race caught one bug: chains that cross</text>
<text class="det" x="28" y="420">a cell border now tick serially in vanilla order.</text>
<text class="cap" x="436" y="112">FARM RATES VS VANILLA</text>
<line x1="600" y1="132" x2="600" y2="392" style="stroke:var(--grid)" stroke-width="1"/>
<text class="n" x="600" y="410" text-anchor="middle">-10 %</text>
<line x1="655" y1="132" x2="655" y2="392" style="stroke:var(--grid)" stroke-width="1"/>
<text class="n" x="655" y="410" text-anchor="middle">-5 %</text>
<line x1="710" y1="132" x2="710" y2="392" style="stroke:var(--ink2)" stroke-width="1.5"/>
<text class="n" x="710" y="410" text-anchor="middle">0</text>
<line x1="765" y1="132" x2="765" y2="392" style="stroke:var(--grid)" stroke-width="1"/>
<text class="n" x="765" y="410" text-anchor="middle">+5 %</text>
<line x1="820" y1="132" x2="820" y2="392" style="stroke:var(--grid)" stroke-width="1"/>
<text class="n" x="820" y="410" text-anchor="middle">+10 %</text>
<text class="l" x="436" y="144">Creeper spawns</text>
<line x1="652.5" y1="140" x2="785.1" y2="140" style="stroke:var(--kiri)" stroke-width="2" stroke-linecap="round"/>
<circle cx="718.8" cy="140" r="6.5" style="fill:var(--ring)"/>
<circle cx="718.8" cy="140" r="4.5" style="fill:var(--kiri)"/>
<text class="l" x="436" y="170">Skeleton spawns</text>
<line x1="681.6" y1="166" x2="800" y2="166" style="stroke:var(--kiri)" stroke-width="2" stroke-linecap="round"/>
<circle cx="740.8" cy="166" r="6.5" style="fill:var(--ring)"/>
<circle cx="740.8" cy="166" r="4.5" style="fill:var(--kiri)"/>
<text class="l" x="436" y="196">Spider spawns</text>
<line x1="676.2" y1="192" x2="798.8" y2="192" style="stroke:var(--kiri)" stroke-width="2" stroke-linecap="round"/>
<circle cx="737.5" cy="192" r="6.5" style="fill:var(--ring)"/>
<circle cx="737.5" cy="192" r="4.5" style="fill:var(--kiri)"/>
<text class="l" x="436" y="222">Zombie spawns</text>
<line x1="646.1" y1="218" x2="747.5" y2="218" style="stroke:var(--kiri)" stroke-width="2" stroke-linecap="round"/>
<circle cx="696.8" cy="218" r="6.5" style="fill:var(--ring)"/>
<circle cx="696.8" cy="218" r="4.5" style="fill:var(--kiri)"/>
<text class="l" x="436" y="248">Platform spawns, pooled</text>
<line x1="693.6" y1="244" x2="729.9" y2="244" style="stroke:var(--kiri)" stroke-width="2" stroke-linecap="round"/>
<circle cx="711.8" cy="244" r="6.5" style="fill:var(--ring)"/>
<circle cx="711.8" cy="244" r="4.5" style="fill:var(--kiri)"/>
<text class="l" x="436" y="274">Piglins, pooled</text>
<line x1="689.6" y1="270" x2="770.5" y2="270" style="stroke:var(--kiri)" stroke-width="2" stroke-linecap="round"/>
<circle cx="730" cy="270" r="6.5" style="fill:var(--ring)"/>
<circle cx="730" cy="270" r="4.5" style="fill:var(--kiri)"/>
<text class="l" x="436" y="300">Pillagers in raids</text>
<line x1="698.7" y1="296" x2="741.1" y2="296" style="stroke:var(--kiri)" stroke-width="2" stroke-linecap="round"/>
<circle cx="719.9" cy="296" r="6.5" style="fill:var(--ring)"/>
<circle cx="719.9" cy="296" r="4.5" style="fill:var(--kiri)"/>
<text class="l" x="436" y="326">Vindicators in raids</text>
<line x1="692.7" y1="322" x2="751.5" y2="322" style="stroke:var(--kiri)" stroke-width="2" stroke-linecap="round"/>
<circle cx="722.1" cy="322" r="6.5" style="fill:var(--ring)"/>
<circle cx="722.1" cy="322" r="4.5" style="fill:var(--kiri)"/>
<text class="l" x="436" y="352">Witches in raids</text>
<line x1="651.3" y1="348" x2="814.9" y2="348" style="stroke:var(--kiri)" stroke-width="2" stroke-linecap="round"/>
<circle cx="733.1" cy="348" r="6.5" style="fill:var(--ring)"/>
<circle cx="733.1" cy="348" r="4.5" style="fill:var(--kiri)"/>
<text class="l" x="436" y="378">Iron golems</text>
<circle cx="710" cy="374" r="6.5" style="fill:var(--ring)"/>
<circle cx="710" cy="374" r="4.5" style="fill:var(--kiri)"/>
<text class="det" x="436" y="434">Dot: difference in rate, line: 95 % interval. All intervals</text>
<text class="det" x="436" y="452">include zero: no measurable difference. Golems identical.</text>
<rect x="16" y="470" width="828" height="84" rx="12" style="fill:var(--plane)"/>
<text class="big" x="36" y="520">0</text>
<text class="bigl" x="79" y="506">mismatches in 103 million</text>
<text class="bigl" x="79" y="524">checked parallel spawn searches</text>
<text class="big" x="312" y="520">0</text>
<text class="bigl" x="355" y="506">overlapping or off-thread</text>
<text class="bigl" x="355" y="524">plugin events in 33 runs</text>
<text class="big" x="588" y="520">±3 %</text>
<text class="bigl" x="682" y="506">every farm rate is within</text>
<text class="bigl" x="682" y="524">3 % of vanilla</text>
<text class="a" x="28" y="580">Vanilla = Fabric with Carpet. Farm rates: 10–32 runs per side, Welch t-test; intervals from the logged t or p values (normal approximation).</text>
</svg>
