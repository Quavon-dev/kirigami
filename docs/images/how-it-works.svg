<title id="t">How Kirigami splits the world</title>
<desc id="d">The world is divided into cells of 8 by 8 chunks, coloured A, B, C and D like a two by two checkerboard. Each phase of a tick runs in four steps: all A cells at once on every core, then all B, C and D cells. Code in a cell writes at most 2 chunks and reads at most 6 chunks beyond its edge; 2 plus 6 is 8, one cell, so what one A cell writes is never read by another A cell in the same step.</desc>
<rect width="860" height="676" rx="14" style="fill:var(--surface)"/>
<text class="t" x="28" y="42">How the world is split</text>
<text class="s" x="28" y="65">Cells of 8 × 8 chunks (128 × 128 blocks), coloured A to D like a checkerboard</text>
