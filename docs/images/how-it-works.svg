<text class="s" x="430" y="350" text-anchor="middle">Within a step every core takes cells from a shared queue; the next step starts when all are done.</text>
<text class="cap" x="28" y="404">2   WHY TWO CELLS OF ONE COLOUR NEVER COLLIDE</text>
<text class="l" x="309" y="436" text-anchor="middle">A cell</text>
