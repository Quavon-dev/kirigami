<text class="s" x="430" y="600" text-anchor="middle">2 + 6 = 8 chunks, exactly one cell. What one A cell writes, no other A cell reads in the same step,</text>
<text class="s" x="430" y="620" text-anchor="middle">so both run at the same time. Reads may overlap: two threads reading one chunk is safe.</text>
<text class="a" x="28" y="654">Reach = how far beyond its own edge code in a cell touches the world. It is measured with kirigami.checkReads in tests.</text>
